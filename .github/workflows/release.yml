name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub release for package.json version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be x.y.z, got: ${VERSION}"
            exit 1
          fi
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          # Re-fetch tags so the local-ref guard and --notes-start-tag do not
          # depend on checkout fetch-depth / fetch-tags staying enabled.
          git fetch origin --tags --force

          # Push the git tag first. Creating a release with --target on a SHA
          # that adds/changes .github/workflows requires workflows:write, which
          # GITHUB_TOKEN cannot have. An existing tag skips that API check.
          #
          # If a previous run pushed the tag and then failed to create the
          # GitHub Release, later main SHAs must not treat that as a hard
          # error (that would fail every subsequent push). Finish the release
          # from the existing tag instead of moving it. Only do that when the
          # tagged commit is an ancestor of this run; a tag off main's history
          # is refused.
          FINISH_NOTES=""
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            EXISTING="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              if ! git merge-base --is-ancestor "$EXISTING" "$GITHUB_SHA"; then
                echo "::error::Tag $TAG points at $EXISTING, which is not an ancestor of $GITHUB_SHA; refusing to create the release."
                exit 1
              fi
              echo "::warning::Tag $TAG already points at $EXISTING (not $GITHUB_SHA); finishing the GitHub release from the existing tag."
              FINISH_NOTES="Finishing an interrupted publish: tag ${TAG} is ${EXISTING}. This workflow run was ${GITHUB_SHA}."
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
          fi

          PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v tag="$TAG" '$0 != tag { print; exit }')"
          CREATE_ARGS=(--title "$TAG" --generate-notes --latest)
          if [ -n "$FINISH_NOTES" ]; then
            CREATE_ARGS+=(--notes "$FINISH_NOTES")
          fi
          if [ -n "${PREV}" ]; then
            CREATE_ARGS+=(--notes-start-tag "${PREV}")
          fi

          gh release create "$TAG" "${CREATE_ARGS[@]}"
