name: Release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  release:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Create GitHub release for package.json version
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION="$(node -p "require('./package.json').version")"
          if [[ ! "$VERSION" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "package.json version must be x.y.z, got: ${VERSION}"
            exit 1
          fi
          TAG="v${VERSION}"

          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists; skipping."
            exit 0
          fi

          # Push the git tag first. Creating a release with --target on a SHA
          # that adds/changes .github/workflows requires workflows:write, which
          # GITHUB_TOKEN cannot have. An existing tag skips that API check.
          if git rev-parse "refs/tags/${TAG}" >/dev/null 2>&1; then
            EXISTING="$(git rev-parse "refs/tags/${TAG}^{commit}")"
            if [ "$EXISTING" != "$GITHUB_SHA" ]; then
              echo "Tag $TAG already points at $EXISTING, not $GITHUB_SHA"
              exit 1
            fi
          else
            git tag "$TAG" "$GITHUB_SHA"
            git push origin "refs/tags/${TAG}"
          fi

          PREV="$(git tag --list 'v*' --sort=-v:refname | awk -v tag="$TAG" '$0 != tag { print; exit }')"
          NOTES_ARGS=()
          if [ -n "${PREV}" ]; then
            NOTES_ARGS+=(--notes-start-tag "${PREV}")
          fi

          gh release create "$TAG" \
            --title "$TAG" \
            --generate-notes \
            --latest \
            "${NOTES_ARGS[@]}"
